services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - db:/data/db
      - media:/data/media
      - ./students:/app/students:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/data/media:ro

volumes:
  db:
  media:
